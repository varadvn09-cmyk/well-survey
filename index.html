<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HydroGeo Field Survey Pro</title>

  <!-- Inbuilt Databases and Master Template -->
  <script src="js/inbuilt_data.js"></script>
  <!-- SheetJS for reading Databases fast -->
  <script src="js/xlsx.full.min.js"></script>
  <!-- ExcelJS for perfect formatting retention during Template writing -->
  <script src="js/exceljs.min.js"></script>
  <!-- html2pdf for high-fidelity exact PDF export -->
  <script src="js/html2pdf.bundle.min.js"></script>
  <!-- Exact HTML templates for Irrigation and PWS technical forms -->
  <script src="js/exact_templates.js"></script>

  <style>
    /* Cleaned and validated CSS variables and core styles (removed broken placeholders) */
    :root, [data-theme="daylight"] {
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --card-subtle: #f1f5f9;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-glow: rgba(37,99,235,0.28);
      --accent: #f59e0b;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-subtle: rgba(15,23,42,0.06);
      --input-bg: #ffffff;
      --badge-bg: #f8fafc;
      --badge-text: #0f172a;
      --danger: #ef4444;
      --dock-bg: rgba(255,255,255,0.6);
      --dock-shadow: 0 6px 18px rgba(37,99,235,0.08);
    }

    /* Simple dark theme example (keeps variables consistent) */
    [data-theme="aquifer"] {
      --bg-page: #090d16;
      --card-bg: #111827;
      --card-subtle: #1f2937;
      --primary: #06b6d4;
      --primary-hover: #0891b2;
      --primary-light: rgba(6,182,212,0.14);
      --primary-glow: rgba(6,182,212,0.38);
      --text-main: #e6eef7;
      --text-muted: #94a3b8;
      --border-color: #172031;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100vw; margin: 0; padding: 0; overflow: hidden; background-color: var(--bg-page); color: var(--text-main); }
    body { display: flex; flex-direction: column; transition: background-color 0.3s, color 0.3s; }

    header { position: relative; background: var(--card-bg); border-bottom: 2px solid var(--primary); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 2[...] }
    .header-left { flex: 1; display: flex; justify-content: flex-start; gap: 10px; align-items: center; }
    .header-center { flex: 2; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .header-right { flex: 1; display: flex; justify-content: flex-end; position: relative; }
    .brand-icon { background: var(--primary); color: var(--card-bg); width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    .header-center h1 { font-size: 1.1rem; font-weight: 800; color: var(--text-main); margin: 0; }

    .btn-settings-dot { background: var(--card-subtle); border: 1.5px solid var(--border-color); color: var(--text-main); position: relative; width: 38px; height: 38px; border-radius: 50%; display[...]
    .btn-settings-dot:hover { border-color: var(--primary); background: var(--primary-light); }
    .settings-icon { font-size: 1.2rem; line-height: 1; }
    .setting-dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--card-bg); box-shadow: 0 0 6px var(--a[...] }

    .settings-dropdown { position: absolute; top: 48px; right: 0; background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.22); mi[...] }
    .settings-dropdown.show { display: block; }
    .settings-dropdown-header { padding: 10px 14px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--text-muted); background: var(--card-subtle); border-bottom: 1px so[...]

    nav.tab-bar { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 14px; right: 14px; max-width: 440px; margin: 0 auto; background: var(--dock-bg); backdrop-filter: blur(12px);[...] }
    .tab-btn { flex: 1; padding: 6px 4px; background: none; border: none; color: var(--text-muted); font-size: 0.72rem; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; al[...]
    .tab-btn.active { color: var(--primary); background: var(--primary-light); }
    .tab-btn-hero { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%); color: #fff; border: none; display: flex; alig[...]

    main { flex: 1 1 auto; overflow: auto; position: relative; padding: 16px; padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .form-section { background: var(--card-bg); border: 1.5px solid var(--border-color); border-radius: 12px; margin-bottom: 16px; padding: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.04); }
    .section-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border-subtle); }
    .section-title { font-size: 0.9rem; font-weight: 900; color: var(--text-main); }
    .section-body { padding-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

    input, select, textarea { width: 100%; background: var(--input-bg); border: 1.5px solid var(--border-color); color: var(--text-main); padding: 10px 12px; border-radius: 8px; font-size: 15px; outli[...] }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78); z-index: 10000; padding: 16px; box-sizing: border-box; overflow-y: auto; }
    .modal-backdrop.active { display: block; }
    .modal-card { background: var(--card-bg); border: 2px solid var(--primary); border-radius: 12px; max-width: 720px; width: 100%; margin: 20px auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .modal-header { padding: 14px 18px; background: var(--card-subtle); border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1.05rem; font-weight: 900; color: var(--primary); }

    /* Utility */
    .hidden { display: none !important; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-subtle); cursor: pointer; font-wei[...]

    @media (max-width: 600px) {
      nav.tab-bar { left: 8px; right: 8px; }
    }

    /* ------------------ Print fixes ------------------ */
    /* Keep the on-screen header visible on-screen but for print we'll show a lightweight print-only header
       placed in the document flow so it appears only on the first printed page. We hide the fixed dock and
       other chrome in print, remove large bottom padding, and avoid page breaks inside form sections. */
    .print-header { display: none; }

    @media print {
      /* Hide interactive chrome that consumes vertical space */
      nav.tab-bar,
      .btn-settings-dot,
      .settings-dropdown,
      .modal-backdrop,
      .modal-card,
      .settings-icon,
      .setting-dot { display: none !important; }

      /* Hide the fixed on-screen header (we'll use print-header instead) */
      header { display: none !important; }

      /* Print-only header that appears in the normal flow (first page only) */
      .print-header { display: block !important; background: #fff; border-bottom: 1px solid #ddd; padding: 10px 12px; margin-bottom: 10px; }
      .print-header .brand { display: flex; align-items: center; gap: 10px; }
      .print-header .brand-icon { width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
      .print-header h2 { font-size: 1rem; margin: 0; font-weight: 800; }

      /* Ensure body/page flows normally */
      html, body { height: auto !important; overflow: visible !important; }
      main { padding-bottom: 0 !important; }

      /* Avoid splitting form-section across pages where possible */
      .form-section {
        break-inside: avoid;
        page-break-inside: avoid;
        -webkit-region-break-inside: avoid;
      }

      /* Make controls print-friendly */
      input, textarea, select { background: transparent !important; color: #000 !important; -webkit-print-color-adjust: exact; border: 1px solid #000 !important; }

      /* Slightly smaller page margins to fit more on small screens if needed */
      @page { margin: 12mm; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="brand-icon">HG</div>
      <div class="brand-text"><strong>HydroGeo</strong></div>
    </div>
    <div class="header-center"><h1>HydroGeo Field Survey Pro</h1></div>
    <div class="header-right">
      <button class="btn-settings-dot" id="settingsBtn" aria-label="Settings">
        <span class="settings-icon">⚙️</span>
        <span class="setting-dot"></span>
      </button>
      <div class="settings-dropdown" id="settingsMenu" aria-hidden="true">
        <div class="settings-dropdown-header">Theme</div>
        <div class="theme-menu-item" data-theme="daylight">Daylight</div>
        <div class="theme-menu-item" data-theme="aquifer">Aquifer</div>
        <div class="theme-menu-item" data-theme="solar">Solar</div>
      </div>
    </div>
  </header>

  <main>
    <!-- Print-only header: visible only when printing and placed in the document flow so it appears on page 1 -->
    <div class="print-header" aria-hidden="true">
      <div class="brand">
        <div class="brand-icon" style="background:var(--primary);color:var(--card-bg);width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;">HG</div>
        <div>
          <h2>HydroGeo Field Survey Pro</h2>
          <div style="font-size:12px;color:#666;">Printed: <span id="printDate"></span></div>
        </div>
      </div>
    </div>

    <section class="tab-panel active" id="panel-home">
      <div class="form-section">
        <div class="section-header">
          <div class="section-title">Survey Gate</div>
        </div>
        <div class="section-body">
          <div>
            <label>Survey Type</label>
            <select>
              <option>Irrigation</option>
              <option>PWS</option>
              <option>Monitoring</option>
            </select>
          </div>
          <div>
            <label>Site Code</label>
            <input placeholder="Enter site code">
          </div>
          <div>
            <label>Date</label>
            <input type="date">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="section-header">
          <div class="section-title">Live Summary</div>
        </div>
        <div class="section-body">
          <div>
            <label>Total Points</label>
            <input readonly value="0">
          </div>
          <div>
            <label>Photos</label>
            <input readonly value="0">
          </div>
        </div>
      </div>
    </section>

    <!-- Modal example -->
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title">Example Modal</div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <p class="modal-info">This is a cleaned template. Replace with actual modal contents as needed.</p>
        </div>
      </div>
    </div>
  </main>

  <nav class="tab-bar" role="navigation">
    <button class="tab-btn" aria-label="Records">📁<div style="font-size:10px">Records</div></button>
    <button class="tab-btn-hero" aria-label="New Survey">＋</button>
    <button class="tab-btn" aria-label="Export">⬇️<div style="font-size:10px">Export</div></button>
  </nav>

  <script>
    // Minimal interactive behavior to toggle settings and modal
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsMenu = document.getElementById('settingsMenu');
    settingsBtn.addEventListener('click', () => {
      const shown = settingsMenu.classList.toggle('show');
      settingsMenu.setAttribute('aria-hidden', (!shown).toString());
    });
    document.querySelectorAll('.theme-menu-item').forEach(el => {
      el.addEventListener('click', () => {
        document.documentElement.setAttribute('data-theme', el.getAttribute('data-theme'));
        settingsMenu.classList.remove('show');
      });
    });

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('active');
    }

    // Set print date in print header
    document.getElementById('printDate').textContent = new Date().toLocaleString();

    // Optional: before printing ensure print header is visible (some browsers may snapshot layout)
    function beforePrintHandler() {
      // nothing heavy — print-header is controlled by CSS only
    }
    if (window.matchMedia) {
      const mediaQueryList = window.matchMedia('print');
      mediaQueryList.addEventListener('change', (m) => {
        if (m.matches) beforePrintHandler();
      });
    }
  </script>
</body>
</html>
